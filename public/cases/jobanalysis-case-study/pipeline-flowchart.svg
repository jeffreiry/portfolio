<svg viewBox="0 0 1400 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1400" height="460" fill="#f8f9fc" rx="16"/>

  <text x="40" y="34" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6366f1">PIPELINE &amp; MODOS DE FALHA</text>

  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Main happy path boxes: x positions 40,264,488,712,936,1160 width 180 -->
  <g font-size="13.5" fill="#1e293b">
    <rect x="40" y="60" width="180" height="90" rx="10" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="130" y="98" text-anchor="middle" font-weight="700">
      <tspan x="130" dy="0">Cola a</tspan>
      <tspan x="130" dy="18">JD</tspan>
    </text>

    <rect x="264" y="60" width="180" height="90" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="354" y="98" text-anchor="middle" font-weight="700">
      <tspan x="354" dy="0">Groq extrai</tspan>
      <tspan x="354" dy="18">JSON</tspan>
    </text>

    <rect x="488" y="60" width="180" height="90" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="578" y="90" text-anchor="middle" font-weight="700">
      <tspan x="578" dy="0">Claude pontua +</tspan>
      <tspan x="578" dy="18">escreve análise</tspan>
    </text>

    <rect x="712" y="60" width="180" height="90" rx="10" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="802" y="90" text-anchor="middle" font-weight="700">
      <tspan x="802" dy="0">Servidor recalcula</tspan>
      <tspan x="802" dy="18">matemática</tspan>
    </text>

    <rect x="936" y="60" width="180" height="90" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="1026" y="90" text-anchor="middle" font-weight="700">
      <tspan x="1026" dy="0">Arquivo .md</tspan>
      <tspan x="1026" dy="18">gravado</tspan>
    </text>

    <rect x="1160" y="60" width="180" height="90" rx="10" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="1250" y="98" text-anchor="middle" font-weight="700">
      <tspan x="1250" dy="0">Índice</tspan>
      <tspan x="1250" dy="18">atualiza</tspan>
    </text>
  </g>

  <!-- Happy-path arrows -->
  <path d="M220,105 L262,105" stroke="#475569" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M444,105 L486,105" stroke="#475569" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M668,105 L710,105" stroke="#475569" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M892,105 L934,105" stroke="#475569" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M1116,105 L1158,105" stroke="#475569" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Error branch connectors (dashed red) -->
  <path d="M354,150 L354,220" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowR)"/>
  <path d="M578,150 L578,220" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowR)"/>
  <path d="M1026,150 L1026,220" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowR)"/>

  <!-- Branch 1: incomplete input -->
  <rect x="224" y="224" width="260" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="224" y="224" width="6" height="150" fill="#dc2626"/>
  <text x="246" y="250" font-size="14" font-weight="700" fill="#991b1b">Entrada incompleta</text>
  <text x="246" y="274" font-size="12.5" fill="#7f1d1d">
    <tspan x="246" dy="0">JD corrompida → Groq gera</tspan>
    <tspan x="246" dy="17">JSON plausível → Claude</tspan>
    <tspan x="246" dy="17">pontua 95% sem requisito</tspan>
    <tspan x="246" dy="17">real por trás.</tspan>
    <tspan x="246" dy="24" font-weight="700">Regra: score alto sem JD</tspan>
    <tspan x="246" dy="17" font-weight="700">arquivada = dado corrompido.</tspan>
  </text>

  <!-- Branch 2: truncated response -->
  <rect x="448" y="224" width="260" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="448" y="224" width="6" height="150" fill="#dc2626"/>
  <text x="470" y="250" font-size="14" font-weight="700" fill="#991b1b">Resposta truncada</text>
  <text x="470" y="274" font-size="12.5" fill="#7f1d1d">
    <tspan x="470" dy="0">JD com muitos requisitos →</tspan>
    <tspan x="470" dy="17">resposta cortada antes do</tspan>
    <tspan x="470" dy="17">metadado → erro genérico</tspan>
    <tspan x="470" dy="17">pro usuário.</tspan>
    <tspan x="470" dy="24" font-weight="700">Fix: teto de tokens maior +</tspan>
    <tspan x="470" dy="17" font-weight="700">log do motivo específico.</tspan>
  </text>

  <!-- Branch 3: slug collision -->
  <rect x="896" y="224" width="260" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="896" y="224" width="6" height="150" fill="#dc2626"/>
  <text x="918" y="250" font-size="14" font-weight="700" fill="#991b1b">Colisão de slug</text>
  <text x="918" y="274" font-size="12.5" fill="#7f1d1d">
    <tspan x="918" dy="0">Reanálise de vaga existente →</tspan>
    <tspan x="918" dy="17">salva com sufixo de</tspan>
    <tspan x="918" dy="17">timestamp, não sobrescreve.</tspan>
    <tspan x="918" dy="24" font-weight="700">Reconcilio à mão, mantendo</tspan>
    <tspan x="918" dy="17" font-weight="700">o conteúdo mais recente.</tspan>
  </text>

  <!-- Legend -->
  <line x1="40" y1="410" x2="80" y2="410" stroke="#475569" stroke-width="2"/>
  <text x="90" y="415" font-size="12.5" fill="#475569">caminho feliz</text>
  <line x1="220" y1="410" x2="260" y2="410" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="270" y="415" font-size="12.5" fill="#475569">ramo de erro documentado (achado real, com data no changelog)</text>
</svg>
