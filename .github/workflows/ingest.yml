name: Ingest de vagas

on:
  schedule:
    # 08:00 BRT (Brasil não tem horário de verão desde 2019, então UTC-3 fixo)
    - cron: '0 11 * * *'
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions no GitHub

# Evita duas rodadas escrevendo no bench ao mesmo tempo se um disparo manual
# coincidir com o agendado (mesmo risco de corrida descrito em ingest-plan.md
# pra rodar duas instâncias --live em paralelo localmente).
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar ingest (Greenhouse + Remotive + 4 Day Week + We Work Remotely + RemoteOK + Adzuna — Gupy é manual, ver ingest-plan.md)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node --experimental-strip-types scripts/ingest/orchestrate.ts --live

      - name: Commit e push se houver vagas novas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Bench_job_applications data/ingest-ledger.json
          if git diff --cached --quiet; then
            echo "Nada novo pra commitar."
          else
            git commit -m "chore: ingest automático de vagas ($(date -u +%Y-%m-%d))"
            git push
          fi
